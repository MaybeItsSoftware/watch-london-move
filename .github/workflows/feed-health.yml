name: Feed health

# The standing watch on the bus feed.
#
# This replaces the 40-minute soak that ran while the URA migration was on
# trial. The trial is over and the Unified bus path has been deleted, so the
# cadence drops to daily — but the check itself stays, and matters more than it
# did: there is no longer a `BUS_FEED_SOURCE=unified` to fall back to, and URA
# is an undocumented 2012 interface that owes us no notice before it changes.
#
# The failure modes are silent. A changed response shape, a frozen upstream or a
# collapsed fleet all leave the service answering 200 with a map that keeps
# moving, so something has to look on a timer and go red.
#
# Two checks, deliberately from different angles:
#   feed-check  asks our own /health whether what we parsed is still sane.
#   ura-probe   asks TfL directly whether URA still agrees with the feed
#               everyone else reads — the drift feed-check cannot see, because a
#               self-consistent parse of a wrong feed looks perfect from inside.
on:
  schedule:
    # Daily at 06:17 UTC — into the morning peak, so the fleet is at full size
    # and a collapse is unambiguous rather than "it is 3am". Off the hour because
    # :00 is where every scheduled workflow on GitHub piles up.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Feed health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require a metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          # Fails rather than warns. /health reports liveness only without this,
          # so the old `warning + exit 0` meant a rotated or deleted secret
          # showed up as a green tick on a run that checked nothing — the exact
          # shape of failure this workflow exists to prevent.
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::METRICS_TOKEN is not set, so /health reports liveness only and the feed is unwatched. Set the repository secret."
            exit 1
          fi

      - name: Sample the deployed feed
        id: feed
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node backend/scripts/feed-check.js | tee feed.txt
        continue-on-error: true

      - name: Compare URA against the Unified feed
        id: probe
        # Independent of the step above: a stale parse and a drifted upstream are
        # different faults with different fixes, and one failing must not hide
        # the other's result.
        run: node backend/scripts/ura-probe.js 2>&1 | tee probe.txt
        continue-on-error: true

      - name: Publish the sample
        # Runs whichever way the checks went, so a red run carries its evidence
        # instead of sending someone to the raw logs.
        if: always()
        run: |
          {
            echo '### Feed check'
            echo '```'
            cat feed.txt 2>/dev/null || echo 'no sample captured'
            echo '```'
            echo '### URA vs Unified'
            echo '```'
            cat probe.txt 2>/dev/null || echo 'no probe captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on an abort signal
        if: steps.feed.outcome == 'failure' || steps.probe.outcome == 'failure'
        run: |
          echo "::error::The bus feed needs attention — read the run summary. There is no Unified path to roll back to; see backend/DEPLOY.md."
          exit 1
