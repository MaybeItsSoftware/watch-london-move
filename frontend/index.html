<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Relative, like every other URL in this build: vite.config.ts sets
         `base: './'` so the same bundle serves a web root, a subdirectory and
         the Capacitor WebView, whose origin is not an http one. The service
         worker in public/sw.js already makes the app work offline; without a
         manifest that only ever amounted to a fast second visit, because
         nothing told Android or the desktop it was installable. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS ignores the manifest's display mode and reads these instead. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="London Move" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero in the
         native shell. user-scalable=no stops the WebView's own pinch-zoom from
         fighting MapLibre's gesture handling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Live 3D map of London's buses, trains and trams moving across the city in real time."
    />
    <meta name="theme-color" content="#0b0f1a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Watch London Move" />
    <meta
      property="og:description"
      content="Live 3D map of London's buses, trains and trams moving across the city in real time."
    />
    <meta property="og:image" content="icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Watch London Move</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
